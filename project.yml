name: Health
options:
  bundleIdPrefix: com.wooram
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: 28829JTDUM
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ENABLE_TESTABILITY: YES

schemes:
  Health:
    build:
      targets:
        Health: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthTests
        - HealthUITests
    archive:
      config: Release

targets:
  Health:
    type: application
    platform: iOS
    productName: Soejil
    sources:
      - path: Health
        excludes:
          - "**/.DS_Store"
          - "Resources/Programs/**"
          - "Resources/Exercises/**"
      - path: Health/Resources/Programs
        type: folder
        buildPhase: resources
      - path: Health/Resources/Exercises
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Soejil
        PRODUCT_MODULE_NAME: Health
        PRODUCT_BUNDLE_IDENTIFIER: com.wooram.health
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 쇠질
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Health/Info.plist
      properties:
        CFBundleDisplayName: 쇠질
        UILaunchScreen: {}

  HealthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HealthTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooram.health.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Health

  HealthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HealthUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wooram.health.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Health
    dependencies:
      - target: Health
